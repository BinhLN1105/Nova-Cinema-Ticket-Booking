name: 🤖 Build & Push AI Service Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'Backend/ai-booking/**'
      - '.github/workflows/deploy-ai-service.yml'
  workflow_dispatch: # Cho phép trigger thủ công từ giao diện GitHub Actions

jobs:
  # 🐳 STAGE 1: BUILD & PUSH DOCKER IMAGE TO DOCKER HUB
  build-and-push:
    name: 🐳 Build & Push AI Docker Image
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'Backend/ai-booking/requirements.txt'

      - name: 📦 Install dependencies & Validate syntax
        run: |
          cd Backend/ai-booking
          pip install -r requirements.txt
          python -m compileall app/ scripts/

      - name: 🛠️ Set up QEMU (Multi-platform support)
        uses: docker/setup-qemu-action@v3

      - name: 🛠️ Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 📦 Build and Push Docker image
        uses: docker/build-push-action@v6
        with:
          context: Backend/ai-booking
          file: Backend/ai-booking/Dockerfile
          push: true
          build-args: |
            COHERE_API_KEY=${{ secrets.COHERE_API_KEY }}
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/novaticket-ai:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/novaticket-ai:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ☁️ STAGE 2: DEPLOY TO AZURE CONTAINER APPS (OPTIONAL / NẾU CÓ CẤU HÌNH)
  deploy-to-azure:
    name: ☁️ Deploy AI to Azure Container Apps
    runs-on: ubuntu-latest
    needs: build-and-push
    if: ${{ vars.DEPLOY_AI_TO_AZURE == 'true' }} # Bật khi có Azure Container App cho AI Service
    steps:
      - name: 🔐 Log in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: 🚀 Update Azure Container App
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ secrets.DOCKERHUB_USERNAME }}/novaticket-ai:${{ github.sha }}
          containerAppName: ${{ secrets.AZURE_AI_CONTAINER_APP_NAME || 'novaticket-ai' }}
          resourceGroup: ${{ secrets.AZURE_RESOURCE_GROUP || 'novaticket-rg' }}
